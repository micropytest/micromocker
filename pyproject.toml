[project]
name = "micromocker"
version = "0.1.0"
description = "A lightweight lib for mocking things on micro:Pytest and MicroPython."
authors = []
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "mpremote (>=1.28.0,<2.0.0)",
  "pyright (>=1.1.408,<2.0.0)",
  "ruff (>=0.15.11,<1.0.0)",
]

[tool.poetry]
package-mode = false
